services:
  traefik:
    image: traefik:${TRAEFIK_VERSION}
    command:
      - --api=true
      - --api.dashboard=true
      
      - --providers.docker=true 
      - --providers.docker.exposedbydefault=false
      
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      
      # SSL 
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.httpchallenge=true
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
      
    ports:
      - "80:80"
      - "443:443"
      
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_letsencrypt:/letsencrypt
      
    networks:
      - proxy

    labels:
       - traefik.enable=true
       
       # Router for dashboard/API
       - traefik.http.routers.traefik.rule=Host(`${TRAEFIK_URL}`) && (PathPrefix(`/api`) || PathPrefix(`/dashboard`))
       
       - traefik.http.routers.traefik.entrypoints=websecure
       - traefik.http.routers.traefik.tls=true
       - traefik.http.routers.traefik.tls.certresolver=le
       - traefik.http.routers.traefik.service=api@internal

       # Dashboard is exposed behind Basic Auth.
       # Use a strong bcrypt/apr1 hash and consider IP allowlisting or VPN-only access.
       - traefik.http.middlewares.traefik-auth.basicauth.users=${TRAEFIK_DASHBOARD_AUTH}
       - traefik.http.routers.traefik.middlewares=traefik-auth

    restart: unless-stopped

volumes:
  traefik_letsencrypt:

networks:
  proxy:
    external: true
    name: proxy
